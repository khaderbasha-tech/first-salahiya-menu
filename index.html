<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Salahiya Restaurant</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

.welcome {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
  background: linear-gradient(135deg, #101010, #573b19, #111);
}

.chef {
  font-size: 75px;
  margin-bottom: 20px;
}

.welcome h1 {
  font-size: 30px;
  color: #f7cf83;
  margin-bottom: 15px;
}

.welcome p {
  font-size: 17px;
  line-height: 1.6;
  margin-bottom: 30px;
}

button {
  background: #d6a64c;
  color: #17110a;
  border: none;
  border-radius: 30px;
  padding: 15px 28px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#menu {
  display: none;
  min-height: 100vh;
  background: #080808;
  padding: 15px 10px 25px;
}

.menu-heading {
  color: #f7cf83;
  font-size: 23px;
  margin: 10px 0 15px;
}

.photo-area {
  width: 100%;
  height: calc(100vh - 155px);
  min-height: 400px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.photo-area img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 8px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 15px;
}

.controls button {
  padding: 13px 22px;
}

.counter {
  color: #fff;
  font-size: 15px;
  min-width: 55px;
}

.restart {
  margin-top: 18px;
  background: #333;
  color: white;
}

@media (max-width: 600px) {
  #menu {
    padding: 8px 5px 15px;
  }

  .menu-heading {
    font-size: 20px;
    margin: 8px 0;
  }

  .photo-area {
    height: calc(100dvh - 135px);
    min-height: 350px;
  }

  .photo-area img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .controls button {
    padding: 12px 18px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<section class="welcome" id="welcome">
  <div class="chef">👨🏻‍🍳</div>

  <h1>FIRST SALAHIYA RESTAURANT</h1>

  <p>
    Welcome to First Salahiya Restaurant!<br>
    We're delighted to serve you.
  </p>

  <button onclick="startMenu()">VIEW OUR MENU</button>
</section>

<section id="menu">
  <h2 class="menu-heading">OUR MENU</h2>

  <div class="photo-area">
    <img id="menuImage"
      src="https://placehold.co/900x1400/252525/ffffff?text=MENU+PAGE+1"
      alt="Restaurant menu page">
  </div>

  <div class="controls">
    <button onclick="previousSlide()">❮ PREVIOUS</button>
    <span class="counter" id="counter">1 / 4</span>
    <button onclick="nextSlide()">NEXT ❯</button>
  </div>

  <button class="restart" onclick="restartMenu()">BACK TO WELCOME</button>
</section>

<script>
const menuPhotos = [
  "https://placehold.co/900x1400/252525/ffffff?text=MENU+PAGE+1",
  "https://placehold.co/900x1400/303030/ffffff?text=MENU+PAGE+2",
  "https://placehold.co/900x1400/383020/ffffff?text=MENU+PAGE+3",
  "https://placehold.co/900x1400/202b25/ffffff?text=MENU+PAGE+4"
];

let current = 0;

function startMenu() {
  const button = document.querySelector(".welcome button");
  button.textContent = "PLEASE WAIT...";

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(
      "Welcome to First Salahiya Restaurant! We are delighted to serve you. Please enjoy exploring our menu."
    );

    speech.lang = "en-IN";
    speech.rate = 0.85;
    speech.pitch = 1;
    speech.volume = 1;

    speech.onend = openMenu;
    speech.onerror = openMenu;

    window.speechSynthesis.speak(speech);

    setTimeout(openMenu, 12000);
  } else {
    openMenu();
  }
}

function openMenu() {
  document.getElementById("welcome").style.display = "none";
  document.getElementById("menu").style.display = "block";
  showSlide();
}

function showSlide() {
  document.getElementById("menuImage").src = menuPhotos[current];
  document.getElementById("counter").textContent =
    (current + 1) + " / " + menuPhotos.length;
}

function nextSlide() {
  current = (current + 1) % menuPhotos.length;
  showSlide();
}

function previousSlide() {
  current = (current - 1 + menuPhotos.length) % menuPhotos.length;
  showSlide();
}

function restartMenu() {
  current = 0;
  document.getElementById("menu").style.display = "none";
  document.getElementById("welcome").style.display = "flex";

  const button = document.querySelector(".welcome button");
  button.textContent = "VIEW OUR MENU";

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}

// Mobile swipe support
let touchStartX = 0;

const photoArea = document.querySelector(".photo-area");

photoArea.addEventListener("touchstart", function(event) {
  touchStartX = event.changedTouches[0].screenX;
});

photoArea.addEventListener("touchend", function(event) {
  const touchEndX = event.changedTouches[0].screenX;
  const difference = touchEndX - touchStartX;

  if (Math.abs(difference) > 50) {
    if (difference < 0) {
      nextSlide();
    } else {
      previousSlide();
    }
  }
});
</script>

</body>
</html>
